[project]
name = "agent-customer"
version = "1.1.0"
description = "电商AI客服"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.52.0",
    "websockets>=10.4",
    "requests>=2.28.0",
    "pyqt6>=6.9.0",
    "pydantic>=2.5.0",
    "pyqt6-fluent-widgets>=1.9.0",
    "sqlalchemy>=2.0.43",
    "openai>=1.109.1",
    "litellm==1.96.2",
    "pillow>=12.0.0",
    "aiofiles>=25.1.0",
    "pandas>=2.1.0,<2.3.0",
    "numpy>=1.24.0,<2.0.0",
    "loguru>=0.7.0",
    "pypdf",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "volcengine>=1.0.209",
    "aiohttp>=3.13.2",
    "tiktoken>=0.12.0",
    "jieba>=0.42.1",
    "xlrd>=2.0.2",
    "pymilvus[milvus-lite]==3.0.2",
    "milvus-lite==3.2.2",
    "pyarrow<21",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[tool.uv]
# 应用型项目：不把自身安装进 venv（避免 editable 安装在中文路径下生成
# UTF-8 .pth 文件、被 GBK locale 的 Python 3.11 site.py 读崩的问题）。
# 从项目根目录运行 app.py / pytest 时，根目录本身在 sys.path 上，不受影响。
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Agent", "Channel", "Message", "bridge", "core", "database", "ui", "utils", "scripts", "service", "rag"]
